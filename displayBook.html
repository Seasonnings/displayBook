<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Book</title>
</head>

<body>
    <div class="container">
        <h2>Book Information Finder</h2>

        <label for="bookSelect">Select a Book Title:</label>
        <select id="bookSelect">
            <option value="">--Choose a book--</option>
        </select>

        <div id="displayArea"></div>
    </div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/Seasonnings/displayBook/main/book.json';

        const selectElement = document.getElementById('bookSelect');
        const displayArea = document.getElementById('displayArea');
        let booksData = [];

        async function fetchBooks() {
            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                booksData = data.Books;

                populateSelectDropdown(booksData);
            } catch (error) {
                console.error('Error fetching JSON data:', error);
                displayArea.innerHTML = '<p class="error">Failed to load book data. Please check the URL or try again later.</p>';
            }
        }

        function populateSelectDropdown(books) {
            books.forEach(book => {
                const option = document.createElement('option');
                option.value = book.title;
                option.textContent = book.title;
                selectElement.appendChild(option);
            });
        }

        selectElement.addEventListener('change', function () {
            const selectedTitle = this.value;

            if (!selectedTitle) {
                displayArea.innerHTML = '';
                return;
            }

            const foundBook = booksData.find(book => book.title === selectedTitle);

            if (foundBook) {
                displayArea.innerHTML = `
                    <div class="book-details">
                        <h3>${foundBook.title}</h3>
                        <p><strong>Author:</strong> ${foundBook.author}</p>
                        <p><strong>Publication Year:</strong> ${foundBook.publicationYear}</p>
                        <p><strong>Genre:</strong> ${foundBook.genres.join(', ')}</p>
                    </div>
                `;
            } else {
                displayArea.innerHTML = `<p class="error">Book not found.</p>`;
            }
        });

        fetchBooks();
    </script>

</body>
</html>
